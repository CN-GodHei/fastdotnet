name:  Feature Request
description: 提出新功能建议或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您为 Fastdotnet 提出宝贵建议！
  - type: textarea
    id: problem
    attributes:
      label: 您的功能请求是否与某个问题相关？
      description: 请清晰简洁地描述问题所在。
      placeholder: 我在开发插件时经常遇到...
  - type: textarea
    id: solution
    attributes:
      label: 描述您想要的解决方案
      description: 请清晰简洁地描述您希望发生的情况。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 描述您考虑过的替代方案
      description: 是否有其他方式可以实现这个功能？
  - type: dropdown
    id: importance
    attributes:
      label: 重要性
      description: 这个功能对您来说有多重要？
      options:
        - 高 (High)
        - 中 (Medium)
        - 低 (Low)
