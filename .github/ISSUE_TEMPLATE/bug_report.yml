name: 🐛 Bug Report
description: 报告程序错误或异常，帮助我们改进 Fastdotnet
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您反馈问题！请尽可能详细地描述您遇到的情况。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请描述您期望的行为和实际发生的行为。
      placeholder: 我期望... 但实际发生了...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 启动应用...
        2. 点击插件管理...
        3. 看到报错...
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: 版本
      description: 您正在使用哪个版本的 Fastdotnet？
      options:
        - v1.0.0 (Latest)
        - v0.9.x
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志输出
      description: 请复制并粘贴任何相关的日志或错误信息。
      render: shell
