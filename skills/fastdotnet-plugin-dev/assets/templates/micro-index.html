<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__DISPLAY_NAME__ - Micro App</title>
</head>
<body>
  <div id="app"></div>
  <!--
    重要：
    1. 路径必须是 /plugins/（小写），宿主映射的前缀就是小写；Linux 区分大小写。
    2. 文件名必须与 vite.config.ts 的 fileName 一致。
  -->
  <script src="/plugins/__PLUGIN_ID__/__FRONTEND_SEGMENT__/__PLUGIN_ID__-__FRONTEND_SEGMENT__.js"></script>
  <!-- lib 模式不会自动注入 CSS，必须显式引用（文件名由 vite.config.ts 的 cssFileName 决定） -->
  <link rel="stylesheet" href="/plugins/__PLUGIN_ID__/__FRONTEND_SEGMENT__/assets/__PLUGIN_ID__-__FRONTEND_SEGMENT__.css" />
</body>
</html>
